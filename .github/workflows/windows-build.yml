name: Build GEBKIM SDS AI Windows Installer

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Upgrade pip
        working-directory: backend
        run: python -m pip install --upgrade pip

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Install PyInstaller
        working-directory: backend
        run: pip install pyinstaller

      - name: Build Windows application
        working-directory: backend
        run: pyinstaller --clean --noconfirm GEBKIM_SDS_AI.spec

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup -y

      - name: Build installer
        shell: powershell
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer\GEBKIM_SDS_AI.iss"

      - name: Upload application folder
        uses: actions/upload-artifact@v4
        with:
          name: GEBKIM_SDS_AI_Windows_App
          path: backend/dist/GEBKIM_SDS_AI/

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: GEBKIM_SDS_AI_Setup
          path: installer/output/GEBKIM_SDS_AI_Setup.exe